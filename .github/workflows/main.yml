name: Patch vbmeta (disable verification)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3 git

      - name: Get avbtool from AOSP
        run: |
          git clone https://android.googlesource.com/platform/external/avb
          chmod +x avb/avbtool.py

      - name: Patch vbmeta
        run: |
          python3 avb/avbtool.py make_vbmeta_image \
            --flags 2 \
            --output vbmeta_disabled.img

      - name: Upload patched vbmeta
        uses: actions/upload-artifact@v4
        with:
          name: vbmeta_disabled
          path: vbmeta_disabled.img
